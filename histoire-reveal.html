<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histoire — Révélation plein écran</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --fg: #f2efe9;
      --accent: #c9a24a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Sections vides pour tester le scroll */
    .spacer {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .spacer span {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(242, 239, 233, 0.35);
    }

    /* ---------- Section à révélation ---------- */
    .reveal { position: relative; }

    .stage {
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }

    /* Le cadre : part d'un rectangle centré (~46% de large), coins arrondis,
       marge sombre autour (le fond #0d0d0d du .stage). Animé via clip-path. */
    .frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      clip-path: inset(20% 27% 20% 27% round 16px);
      will-change: clip-path;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.3);
      will-change: transform;
      display: block;
    }

    /* Overlay texte + dégradé sombre pour la lisibilité */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: clamp(1.5rem, 6vw, 6rem);
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.78) 0%,
        rgba(0, 0, 0, 0.3) 42%,
        rgba(0, 0, 0, 0) 72%
      );
      pointer-events: none;
    }
    .content {
      max-width: 60rem;
      opacity: 0;
      transform: translateY(40px);
      will-change: opacity, transform;
    }
    .label {
      display: block;
      margin-bottom: 1rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .content h2 {
      font-size: clamp(1.9rem, 4.6vw, 4.25rem);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 34px rgba(0, 0, 0, 0.6);
    }
    .content p {
      margin-top: 1.25rem;
      max-width: 36rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      line-height: 1.6;
      color: rgba(242, 239, 233, 0.82);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.6);
    }

    /* Accessibilité : pas de pin/scrub, image plein écran + texte affichés */
    @media (prefers-reduced-motion: reduce) {
      .frame { clip-path: inset(0% 0% 0% 0% round 0px) !important; }
      .hero-img { transform: none !important; }
      .content { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <section class="spacer"><span>Faites défiler ↓</span></section>

  <!-- ================= SECTION À RÉVÉLATION ================= -->
  <section class="reveal" aria-label="Histoire">
    <div class="stage">
      <div class="frame">
        <!-- Placeholder d'intérieur sombre haut de gamme — remplace par ton rendu -->
        <img
          class="hero-img"
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80"
          alt="Intérieur haut de gamme"
        />
        <div class="overlay">
          <div class="content">
            <span class="label">Histoire</span>
            <h2>
              Conception d'intérieur spécialisée pour maisons de ville et maisons
              individuelles.
            </h2>
            <p>
              La norme pour les intérieurs haut de gamme, même dans les endroits
              les plus insoupçonnés.
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="spacer"><span>La suite ↓</span></section>

  <!-- ================= GSAP (CDN) ================= -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return; // le CSS affiche déjà l'image plein écran + le texte

      gsap.registerPlugin(ScrollTrigger);

      // Sur mobile, on réduit l'inset horizontal de départ pour que l'effet
      // reste visible (sinon le cadre serait trop étroit).
      var isMobile = window.matchMedia("(max-width: 768px)").matches;
      var startClip = isMobile
        ? "inset(28% 8% 28% 8% round 16px)"
        : "inset(20% 27% 20% 27% round 16px)";

      gsap.set(".frame", { clipPath: startClip });
      gsap.set(".hero-img", { scale: 1.3 });
      gsap.set(".content", { opacity: 0, y: 40 });

      var tl = gsap.timeline({
        defaults: { ease: "none" },
        scrollTrigger: {
          trigger: ".reveal",
          start: "top top",
          end: "+=150%",
          scrub: true,
          pin: ".stage",
          anticipatePin: 1,
          invalidateOnRefresh: true,
        },
      });

      // 1) Le masque s'ouvre (rectangle centré -> plein cadre) + coins -> 0.
      tl.to(".frame", { clipPath: "inset(0% 0% 0% 0% round 0px)", duration: 1 }, 0);
      // 2) L'image se "pose" (zoom 1.3 -> 1).
      tl.to(".hero-img", { scale: 1, duration: 1 }, 0);
      // 3) Le texte apparaît en fondu sur la 2e moitié de la timeline.
      tl.to(".content", { opacity: 1, y: 0, duration: 0.5 }, 0.5);
    })();
  </script>
</body>
</html>
